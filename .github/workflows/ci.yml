name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable — tracks latest stable Rust
        # 1.78   — MSRV declared in README ("Rust 1.78+")
        toolchain: [stable, "1.78"]
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
          # Separate cache per toolchain to avoid cross-contamination
          key: ${{ matrix.toolchain }}

      - name: Format check
        # Only enforce formatting on stable; MSRV rustfmt may produce different
        # output for features introduced after 1.78.
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: Clippy
        # Identical to the command documented in README.md ("Build & Test").
        # -D warnings is required on ALL matrix legs so MSRV is lint-clean too.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown --release

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit
