name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract (Soroban)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown --release

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        id: audit
        # Run cargo-audit and capture output regardless of exit code so we can
        # always write to the step summary before propagating the failure.
        run: |
          set +e
          AUDIT_OUTPUT=$(cargo audit --color never 2>&1)
          AUDIT_EXIT=$?
          set -e

          # ── GitHub Actions step summary ──────────────────────────────────
          {
            if [ $AUDIT_EXIT -eq 0 ]; then
              echo "## ✅ Dependency Audit — Clean"
              echo ""
              echo "No advisories found in the RustSec database."
            else
              echo "## ❌ Dependency Audit — Advisories Found"
              echo ""
              echo "One or more advisories were reported by \`cargo audit\`."
              echo "Review the findings below and update or patch the affected crates."
            fi
            echo ""
            echo "### cargo audit output"
            echo ""
            echo '```'
            echo "$AUDIT_OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Propagate the original exit code so the job still fails on findings.
          exit $AUDIT_EXIT
