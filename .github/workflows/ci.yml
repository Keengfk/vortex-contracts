name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── GITHUB_TOKEN permission policy ────────────────────────────────────────────
#
# Hardened to the minimum required by every job in this workflow.
#
# Why contents: read and nothing else:
#   All jobs here only need to check out source code (contents: read).
#   None of them write commits, create releases, post PR comments, call the
#   Packages API, or use any other GitHub API scope.  GITHUB_STEP_SUMMARY
#   writes are local runner file writes — not a GitHub API permission.
#
# Trigger coverage:
#   For `pull_request` events from forks, GitHub already restricts the token
#   to read-only.  For `push` to `main` from the same repo, the default token
#   carries `contents: write`.  This explicit block overrides both trigger
#   types and removes that unneeded write privilege.
#
# Future jobs that need elevated scope:
#   Add an explicit job-level `permissions:` override with only the additional
#   scope that job requires (e.g. `pull-requests: write` for a PR comment job).
#   Do NOT widen the top-level block.
#
# Per-job audit (all trigger types, checked 2026-08-31):
#   fmt           — checkout only                    → contents: read  ✓
#   contract      — checkout, clippy, test           → contents: read  ✓
#   wasm-size     — checkout, build, STEP_SUMMARY    → contents: read  ✓
#   proptest      — checkout, cargo test             → contents: read  ✓
#   audit         — checkout, cargo audit            → contents: read  ✓
#   mutants       — checkout, cargo mutants          → contents: read  ✓
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    # Needs: contents: read (checkout only). Inherits workflow-level minimum.
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  contract:
    name: Contract (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    # Needs: contents: read (checkout only). Inherits workflow-level minimum.
    strategy:
      fail-fast: false
      matrix:
        # stable — tracks latest stable Rust
        # 1.78   — MSRV declared in README ("Rust 1.78+")
        toolchain: [stable, "1.78"]
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
          # Separate cache per toolchain to avoid cross-contamination
          key: ${{ matrix.toolchain }}

      - name: Format check
        # Only enforce formatting on stable; MSRV rustfmt may produce different
        # output for features introduced after 1.78.
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: Clippy
        # Identical to the command documented in README.md ("Build & Test").
        # -D warnings is required on ALL matrix legs so MSRV is lint-clean too.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  wasm-size:
    name: Wasm size budget
    runs-on: ubuntu-latest
    # Needs: contents: read (checkout only). GITHUB_STEP_SUMMARY is a local
    # runner file write — it does not require any GitHub API permission.
    # Inherits workflow-level minimum.
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Check wasm size
        shell: bash
        run: |
          # Soroban network limit is 64 KB for a contract wasm binary.
          # We budget at 90 % of that to leave headroom: 58 982 bytes.
          MAX_BYTES=58982
          WASM=$(ls target/wasm32-unknown-unknown/release/*.wasm | head -n1)
          SIZE=$(wc -c < "$WASM")
          echo "### Wasm size report" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size (bytes) | Budget (bytes) | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ---- | -----------: | -------------: | ------ |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -le "$MAX_BYTES" ]; then
            echo "| \`$(basename $WASM)\` | $SIZE | $MAX_BYTES | ✅ under budget |" >> "$GITHUB_STEP_SUMMARY"
            echo "Wasm size OK: $SIZE bytes (limit $MAX_BYTES bytes)"
          else
            echo "| \`$(basename $WASM)\` | $SIZE | $MAX_BYTES | ❌ over budget |" >> "$GITHUB_STEP_SUMMARY"
            echo "ERROR: Wasm size $SIZE bytes exceeds budget of $MAX_BYTES bytes." >&2
            exit 1
          fi

  proptest:
    name: Bond-conservation proptest
    runs-on: ubuntu-latest
    # Needs: contents: read (checkout only). Inherits workflow-level minimum.
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Bond conservation proptest
        # PROPTEST_CASES controls how many random sequences are generated per
        # test; 256 balances coverage against CI runtime.
        run: PROPTEST_CASES=256 cargo test --features testutils -- bond_conservation

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Needs: contents: read (checkout only). cargo-audit reads Cargo.lock from
    # the checked-out tree and queries the RustSec advisory DB over HTTPS —
    # neither operation touches the GitHub API. Inherits workflow-level minimum.
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Needs: contents: read (checkout only). cargo-mutants mutates source in a
    # temporary copy on the runner — no GitHub API calls. Inherits workflow-level
    # minimum.
    defaults:
      run:
        working-directory: intent_settlement
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run mutation tests
        run: cargo mutants --copy-target=false
