name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  contract:
    name: Contract (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable — tracks latest stable Rust
        # 1.78   — MSRV declared in README ("Rust 1.78+")
        toolchain: [stable, "1.78"]
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
          # Separate cache per toolchain to avoid cross-contamination
          key: ${{ matrix.toolchain }}

      - name: Format check
        # Only enforce formatting on stable; MSRV rustfmt may produce different
        # output for features introduced after 1.78.
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: Clippy
        # Identical to the command documented in README.md ("Build & Test").
        # -D warnings is required on ALL matrix legs so MSRV is lint-clean too.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  wasm-size:
    name: Wasm size budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Optimize wasm
        shell: bash
        run: |
          # Measure the artifact that actually gets deployed: the release build
          # after `wasm-opt -Oz`, the same optimization `stellar contract
          # optimize` applies. The raw `cargo build` output is ~68 KB; -Oz
          # brings it to ~61 KB.
          RAW=$(ls target/wasm32-unknown-unknown/release/*.wasm | head -n1)
          wasm-opt -Oz \
            --enable-bulk-memory --enable-sign-ext --enable-mutable-globals \
            --enable-nontrapping-float-to-int --enable-reference-types \
            --enable-multivalue --strip-debug --strip-producers \
            "$RAW" -o "${RAW%.wasm}.optimized.wasm"
      - name: Check wasm size
        shell: bash
        run: |
          # Soroban's on-chain contract-wasm limit is 64 KB (65 536 bytes).
          # Budget: 63 000 bytes for the optimized artifact, leaving a small
          # deploy-time margin under the hard limit.
          #
          # NOTE (follow-up): the contract has grown close to the limit as
          # features landed. A dedicated size-reduction pass (dead-code audit,
          # splitting rarely-used entrypoints into a companion contract) is
          # needed to restore real headroom.
          MAX_BYTES=63000
          WASM=$(ls target/wasm32-unknown-unknown/release/*.optimized.wasm | head -n1)
          SIZE=$(wc -c < "$WASM")
          echo "### Wasm size report" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size (bytes) | Budget (bytes) | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ---- | -----------: | -------------: | ------ |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -le "$MAX_BYTES" ]; then
            echo "| \`$(basename $WASM)\` | $SIZE | $MAX_BYTES | ✅ under budget |" >> "$GITHUB_STEP_SUMMARY"
            echo "Wasm size OK: $SIZE bytes (limit $MAX_BYTES bytes)"
          else
            echo "| \`$(basename $WASM)\` | $SIZE | $MAX_BYTES | ❌ over budget |" >> "$GITHUB_STEP_SUMMARY"
            echo "ERROR: Wasm size $SIZE bytes exceeds budget of $MAX_BYTES bytes." >&2
            exit 1
          fi

  proptest:
    name: Bond-conservation proptest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Bond conservation proptest
        # PROPTEST_CASES controls how many random sequences are generated per
        # test; 256 balances coverage against CI runtime.
        run: PROPTEST_CASES=256 cargo test --features testutils -- bond_conservation

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intent_settlement
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run mutation tests
        run: cargo mutants --copy-target=false
